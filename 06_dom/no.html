function addElement (lang) {
const li = document.createElement('li')
const addText = document.createTextNode(lang)
li.appendChild(addText)
document.querySelector('.no').appendChild(li);
}

addElement('js');
addElement('php');
addElement('python');

//  change.textContent = 'JAVASCRIPT'

change.replaceWith(neww)
